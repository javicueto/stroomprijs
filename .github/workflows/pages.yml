name: Test and publish the page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests
        run: node --test tests/

      # web/shared holds generated copies. A stale copy would publish old
      # price logic while every test on shared/ passes.
      - name: Generated copies match shared/ and config/
        run: |
          for f in classify.js describe.js fetch-prices.js; do
            diff <(tail -n +3 "web/shared/$f") "shared/$f" > /dev/null \
              || { echo "::error::web/shared/$f is out of date — run scripts/sync_shared.sh"; exit 1; }
          done
          node -e '
            const fs = require("fs");
            const copy = require("./web/shared/config.js");
            const source = JSON.parse(fs.readFileSync("config/tariff.json", "utf8"));
            if (JSON.stringify(copy) !== JSON.stringify(source)) { console.error("::error::web/shared/config.js is out of date — run scripts/sync_shared.sh"); process.exit(1); }
          '

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
