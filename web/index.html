<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>⚡ Stroom</title>
  <meta name="description" content="Is electricity cheap now? When is it cheap next? And tomorrow? — Eneco Dynamisch.">
  <meta name="theme-color" content="#f1f0ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stroom">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="brand">⚡ Stroom</p>
      <p class="today-label" id="today-label"></p>
    </header>

    <section class="hero" id="hero" aria-live="polite" aria-label="Electricity now"></section>

    <section class="keys" id="keys" aria-label="Next cheap and expensive hours, and tomorrow"></section>

    <section class="strip-card" aria-labelledby="strip-title">
      <h2 class="section-label" id="strip-title">From now to the end of tomorrow</h2>
      <div id="strip"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>

  <noscript><p class="page">This page needs JavaScript to load the prices.</p></noscript>

  <script src="shared/config.js"></script>
  <script src="shared/classify.js"></script>
  <script src="shared/describe.js"></script>
  <script src="shared/fetch-prices.js"></script>
  <script src="app.js"></script>

</html>
